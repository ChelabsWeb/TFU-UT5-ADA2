# API Gateway: único punto de entrada. API key, rate limiting y Gateway Routing por prefijo.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS de Docker

    map $http_x_api_key $api_key_valida {
        default          0;
        "clave-demo-ut5" 1;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

    # svc-despacho es el servicio crítico: dos réplicas balanceadas.
    # Si una no responde, nginx la saca 30 s y reintenta en la otra (proxy_next_upstream).
    upstream despacho {
        server svc-despacho-1:8000 max_fails=1 fail_timeout=30s;
        server svc-despacho-2:8000 max_fails=1 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 300ms;
        proxy_read_timeout 5s;

        location = /health { return 200 "ok\n"; }

        location /api/ {
            if ($api_key_valida = 0) { return 401 '{"detail":"API key inválida"}'; }
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;

            location /api/despachos {
                if ($api_key_valida = 0) { return 401; }
                proxy_pass http://despacho/despachos;
                # POST no es idempotente: solo se pasa a la otra réplica si no se pudo conectar
                # (error o timeout de conexión: el pedido nunca llegó a la réplica caída).
                proxy_next_upstream error timeout;
                proxy_next_upstream_tries 2;
            }
            location /api/ambulancias {
                if ($api_key_valida = 0) { return 401; }
                set $flota http://svc-flota:8000;
                rewrite ^/api/(.*)$ /$1 break;
                proxy_pass $flota;
            }
            location /api/reportes {
                if ($api_key_valida = 0) { return 401; }
                set $reportes http://svc-reportes:8000;
                rewrite ^/api/(.*)$ /$1 break;
                proxy_pass $reportes;
            }
            return 404;
        }
    }
}
